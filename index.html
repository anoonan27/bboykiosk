<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Temperature Kiosk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --bg2: #111720;
    --bg3: #181f2a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --accent: #00d4aa;
    --accent2: #0099ff;
    --warm: #ff6b35;
    --cool: #4fc3f7;
    --text: #e8edf4;
    --text2: #8a95a3;
    --text3: #4a5568;
    --font-mono: 'DM Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
    --red: #ff4757;
    --green: #00d4aa;
    --amber: #ffa502;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Grid background */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: rgba(10,14,20,0.9);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .logo-mark::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: rgba(0,212,170,0.15);
  }

  .logo-mark svg { z-index: 1; }

  .topbar-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .topbar-title span {
    color: var(--accent);
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  .pulse.active {
    animation: pulse 2s ease infinite;
  }

  .pulse.error { background: var(--red); animation: none; }
  .pulse.loading { background: var(--amber); animation: blink 1s ease infinite; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,212,170,0.5); }
    50% { box-shadow: 0 0 0 5px rgba(0,212,170,0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .clock {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 0.05em;
  }

  /* ── Config panel ── */
  .config-panel {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0.75rem 2rem;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .config-group {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .config-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  input[type="password"], input[type="text"], select {
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 5px 10px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="password"]:focus, input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }

  input[type="password"] { width: 220px; }

  select { cursor: pointer; }

  select option { background: var(--bg3); }

  .btn {
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 5px;
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: scale(0.97); }

  .btn-primary {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── Error banner ── */
  .error-banner {
    display: none;
    margin: 1rem 2rem 0;
    padding: 0.75rem 1rem;
    background: rgba(255,71,87,0.1);
    border: 1px solid rgba(255,71,87,0.3);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: #ff8a94;
  }

  /* ── Main content ── */
  .main {
    flex: 1;
    padding: 1.5rem 2rem 2rem;
  }

  /* ── Stats bar ── */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .stat-chip {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-chip-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .stat-chip-val {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }

  .stat-chip-val.accent { color: var(--accent); }
  .stat-chip-val.warm { color: var(--warm); }
  .stat-chip-val.cool { color: var(--cool); }

  /* ── Sensor grid ── */
  .sensor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .sensor-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    animation: cardIn 0.3s ease both;
  }

  .sensor-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .sensor-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    opacity: 0.6;
  }

  .sensor-card.hot::before { background: linear-gradient(90deg, var(--warm), transparent); }
  .sensor-card.cool-card::before { background: linear-gradient(90deg, var(--cool), transparent); }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-device {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-varname {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-temp {
    font-family: var(--font-mono);
    font-size: 42px;
    font-weight: 300;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .card-temp .unit {
    font-size: 20px;
    color: var(--text2);
    font-weight: 300;
  }

  .card-temp.no-data {
    font-size: 32px;
    color: var(--text3);
  }

  .card-footer {
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }

  .card-updated {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
  }

  .card-trend {
    font-family: var(--font-mono);
    font-size: 11px;
  }

  /* Temp bar */
  .temp-bar-wrap {
    margin-top: 10px;
    height: 3px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }

  .temp-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
    background: var(--accent);
  }

  .temp-bar.hot { background: var(--warm); }
  .temp-bar.cool { background: var(--cool); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text3);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 2;
  }

  .empty svg { margin-bottom: 1rem; opacity: 0.3; }

  /* Countdown ring */
  .countdown-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
  }

  .countdown-ring {
    width: 20px;
    height: 20px;
    position: relative;
  }

  .countdown-ring svg {
    transform: rotate(-90deg);
  }

  .countdown-ring circle {
    fill: none;
    stroke: var(--border2);
    stroke-width: 2;
  }

  .countdown-ring .progress {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 1rem 2rem;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    border-top: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  @media (max-width: 600px) {
    .topbar, .config-panel, .main { padding-left: 1rem; padding-right: 1rem; }
    .config-panel { gap: 8px; }
    input[type="password"] { width: 160px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 2 L8 8 L13 11" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="5.5" stroke="#00d4aa" stroke-width="1"/>
        </svg>
      </div>
      <span class="topbar-title">Temp<span>Monitor</span></span>
    </div>
    <div class="topbar-right">
      <div class="live-badge">
        <div class="pulse loading" id="statusDot"></div>
        <span id="statusText">Initialising</span>
      </div>
      <div class="countdown-wrap">
        <div class="countdown-ring">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8"/>
            <circle cx="10" cy="10" r="8" class="progress" id="countdownCircle"
              stroke-dasharray="50.27" stroke-dashoffset="0"/>
          </svg>
        </div>
        <span id="countdownLabel">—</span>
      </div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
  </header>

  <!-- Config panel -->
  <div class="config-panel">
    <div class="config-group">
      <span class="config-label">Token</span>
      <input type="password" id="tokenInput" value="BBUS-bw7GoYCSYCJmPt9ppRFdo3WhjRhgwn" placeholder="BBUS-…" />
    </div>
    <div class="config-group">
      <span class="config-label">Unit</span>
      <select id="unitSelect">
        <option value="C">°C</option>
        <option value="F">°F</option>
      </select>
    </div>
    <div class="config-group">
      <span class="config-label">Refresh</span>
      <select id="intervalSelect">
        <option value="10">10 s</option>
        <option value="30" selected>30 s</option>
        <option value="60">1 min</option>
        <option value="300">5 min</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadData()">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
      </svg>
      Refresh now
    </button>
    <button class="btn" onclick="toggleFullscreen()">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.5 1h4a.5.5 0 0 1 0 1H2.707L6.354 5.646a.5.5 0 0 1-.708.708L2 2.707V5.5a.5.5 0 0 1-1 0v-4A.5.5 0 0 1 1.5 1m9 0h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V2.707l-3.646 3.647a.5.5 0 0 1-.708-.708L13.293 2H10.5a.5.5 0 0 1 0-1M1 10.5a.5.5 0 0 1 1 0v2.793l3.646-3.647a.5.5 0 0 1 .708.708L2.707 14H5.5a.5.5 0 0 1 0 1h-4a.5.5 0 0 1-.5-.5zm14.354.354a.5.5 0 0 0-.708-.708L11 14.293V11.5a.5.5 0 0 0-1 0v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 0-1h-2.793z"/>
      </svg>
      Fullscreen
    </button>
  </div>

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner"></div>

  <!-- Main -->
  <main class="main">

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar" style="display:none">
      <div class="stat-chip">
        <span class="stat-chip-label">Sensors</span>
        <span class="stat-chip-val accent" id="statCount">—</span>
      </div>
      <div class="stat-chip">
        <span class="stat-chip-label">Average</span>
        <span class="stat-chip-val" id="statAvg">—</span>
      </div>
      <div class="stat-chip">
        <span class="stat-chip-label">Highest</span>
        <span class="stat-chip-val warm" id="statMax">—</span>
      </div>
      <div class="stat-chip">
        <span class="stat-chip-label">Lowest</span>
        <span class="stat-chip-val cool" id="statMin">—</span>
      </div>
    </div>

    <!-- Sensor cards -->
    <div class="sensor-grid" id="grid">
      <div class="empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
        </svg>
        <div>Loading sensor data…</div>
      </div>
    </div>

  </main>

  <footer class="footer">
    TempMonitor — Ubidots Industrial · Last updated: <span id="lastUpdated">—</span>
  </footer>

</div>

<script>
  const CIRCUMFERENCE = 50.27;
  let refreshTimer = null;
  let countdownTimer = null;
  let countdownRemaining = 0;
  let countdownTotal = 30;

  // Clock
  function updateClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-GB', { hour12: false });
  }
  setInterval(updateClock, 1000);
  updateClock();

  function toF(c) { return +(c * 9/5 + 32).toFixed(1); }
  function timeAgo(ts) {
    if (!ts) return '—';
    const d = Math.floor((Date.now() - ts) / 1000);
    if (d < 60) return d + 's ago';
    if (d < 3600) return Math.floor(d/60) + 'm ago';
    return Math.floor(d/3600) + 'h ago';
  }

  function setStatus(state, text) {
    const dot = document.getElementById('statusDot');
    dot.className = 'pulse ' + state;
    document.getElementById('statusText').textContent = text;
  }

  function showError(msg) {
    const b = document.getElementById('errorBanner');
    b.textContent = '⚠ ' + msg;
    b.style.display = 'block';
    setStatus('error', 'Error');
  }

  function clearError() {
    document.getElementById('errorBanner').style.display = 'none';
  }

  function tempClass(val) {
    if (val === null) return '';
    if (val > 35) return 'hot';
    if (val < 10) return 'cool-card';
    return '';
  }

  function barClass(val) {
    if (val > 35) return 'hot';
    if (val < 10) return 'cool';
    return '';
  }

  function barWidth(val, unit) {
    if (val === null) return 0;
    const c = unit === 'F' ? (val - 32) * 5/9 : val;
    const pct = Math.max(0, Math.min(100, ((c + 20) / 80) * 100));
    return pct.toFixed(1);
  }

  function startCountdown(seconds) {
    countdownTotal = seconds;
    countdownRemaining = seconds;
    if (countdownTimer) clearInterval(countdownTimer);
    updateCountdown();
    countdownTimer = setInterval(() => {
      countdownRemaining--;
      updateCountdown();
      if (countdownRemaining <= 0) clearInterval(countdownTimer);
    }, 1000);
  }

  function updateCountdown() {
    const circle = document.getElementById('countdownCircle');
    const label = document.getElementById('countdownLabel');
    const pct = countdownRemaining / countdownTotal;
    const offset = CIRCUMFERENCE * (1 - pct);
    circle.style.strokeDashoffset = offset;
    label.textContent = countdownRemaining + 's';
  }

  async function loadData() {
    clearError();
    const token = document.getElementById('tokenInput').value.trim();
    const unit = document.getElementById('unitSelect').value;
    if (!token) { showError('Enter your Ubidots token above.'); return; }
    setStatus('loading', 'Fetching…');

    try {
      const devRes = await fetch('https://industrial.api.ubidots.com/api/v2.0/devices/?page_size=100', {
        headers: { 'X-Auth-Token': token }
      });
      if (!devRes.ok) {
        showError('Auth failed — status ' + devRes.status + '. Check your token.');
        return;
      }
      const devData = await devRes.json();
      const devices = devData.results || [];

      const allVars = [];
      for (const dev of devices) {
        const vRes = await fetch(
          `https://industrial.api.ubidots.com/api/v2.0/devices/${dev.id}/variables/?page_size=100`,
          { headers: { 'X-Auth-Token': token } }
        );
        if (!vRes.ok) continue;
        const vData = await vRes.json();
        for (const v of (vData.results || [])) {
          const lbl = (v.label || '').toLowerCase();
          const nm  = (v.name  || '').toLowerCase();
          if (lbl.includes('temp') || nm.includes('temp') || lbl === 't') {
            let rawVal = (v.lastValue && v.lastValue.value != null) ? v.lastValue.value : null;
            let ts     = (v.lastValue && v.lastValue.timestamp) ? v.lastValue.timestamp : null;
            let dispVal = rawVal;
            if (rawVal !== null && unit === 'F') dispVal = toF(rawVal);
            allVars.push({
              device: dev.name || dev.label,
              varName: v.name || v.label,
              rawVal,
              dispVal,
              ts
            });
          }
        }
      }

      const grid = document.getElementById('grid');

      if (!allVars.length) {
        grid.innerHTML = `<div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
          </svg>
          <div>No temperature variables found.<br>Label your Ubidots variables "temperature" to show them here.</div>
        </div>`;
        document.getElementById('statsBar').style.display = 'none';
      } else {
        const vals = allVars.map(v => v.rawVal).filter(v => v !== null);
        const avg  = vals.length ? (vals.reduce((a,b) => a+b, 0) / vals.length) : null;
        const maxV = vals.length ? Math.max(...vals) : null;
        const minV = vals.length ? Math.min(...vals) : null;

        const fmt = (v, u) => {
          if (v === null) return '—';
          return (u === 'F' ? toF(v) : v.toFixed(1)) + ' °' + u;
        };

        document.getElementById('statCount').textContent = allVars.length;
        document.getElementById('statAvg').textContent   = fmt(avg, unit);
        document.getElementById('statMax').textContent   = fmt(maxV, unit);
        document.getElementById('statMin').textContent   = fmt(minV, unit);
        document.getElementById('statsBar').style.display = 'grid';

        grid.innerHTML = allVars.map((v, i) => {
          const tc = tempClass(v.rawVal);
          const dispStr = v.dispVal !== null
            ? `<span>${v.dispVal % 1 === 0 ? v.dispVal : parseFloat(v.dispVal).toFixed(1)}</span><span class="unit"> °${unit}</span>`
            : `<span class="no-data">N/A</span>`;
          const bw = barWidth(v.dispVal, unit);
          const bc = barClass(v.rawVal);
          return `<div class="sensor-card ${tc}" style="animation-delay:${i*0.04}s">
            <div class="card-device">${v.device}</div>
            <div class="card-varname">${v.varName}</div>
            <div class="card-temp">${dispStr}</div>
            <div class="temp-bar-wrap"><div class="temp-bar ${bc}" style="width:${bw}%"></div></div>
            <div class="card-footer">
              <span class="card-updated">${timeAgo(v.ts)}</span>
              <span class="card-trend" style="color:${v.rawVal > 30 ? 'var(--warm)' : v.rawVal < 10 ? 'var(--cool)' : 'var(--text3)'}">
                ${v.rawVal > 35 ? '▲ HOT' : v.rawVal < 5 ? '▼ COLD' : ''}
              </span>
            </div>
          </div>`;
        }).join('');
      }

      setStatus('active', devices.length + ' device' + (devices.length !== 1 ? 's' : ''));
      document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

    } catch (e) {
      showError('Network error: ' + e.message);
    }

    scheduleRefresh();
  }

  function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    const secs = parseInt(document.getElementById('intervalSelect').value);
    startCountdown(secs);
    refreshTimer = setTimeout(loadData, secs * 1000);
  }

  document.getElementById('intervalSelect').addEventListener('change', () => {
    if (refreshTimer) clearTimeout(refreshTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    scheduleRefresh();
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  loadData();
</script>
</body>
</html>
